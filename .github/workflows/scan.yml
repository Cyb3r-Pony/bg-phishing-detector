name: Hourly Phishing Scanner

on:
  schedule:
    # Run every hour at the beginning of the hour (XX:00)
    - cron: '0 * * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

# Prevent multiple workflows from running simultaneously
concurrency:
  group: phishing-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Safety timeout to prevent overlaps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Guards the detection rules: known Bulgarian phishing must still be
      # flagged and known false positives must still be rejected. A rule
      # change that breaks either one fails here instead of polluting the feed.
      - name: Run detection regression tests
        run: python detection/test_detector.py

      - name: Run phishing scanner
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
        run: |
          echo "Starting phishing scan at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          python detection/bg-phishing-detector.py --sources urlscan manual
        continue-on-error: false

      - name: Check for new findings
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain feed/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Feed updated"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No new findings this scan"
          fi

      - name: Commit and push findings
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'Phishing Scanner Bot'
          git config --global user.email 'scanner@bg-phishing-detector'

          git add -f feed/phishing_feed.json feed/stats.json
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "🚨 Phishing scan results - $TIMESTAMP [skip ci]"

          # Push with retry. --autostash keeps the rebase from aborting on any
          # stray working-tree changes, which is what used to wedge this step.
          for i in {1..3}; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "✅ Successfully pushed changes"
              break
            elif [ $i -lt 3 ]; then
              echo "⚠️  Push failed, retrying in 5 seconds... (attempt $i/3)"
              sleep 5
            else
              echo "❌ Failed to push after 3 attempts"
              exit 1
            fi
          done

      - name: Scan summary
        if: always()
        run: |
          echo "### 🚨 Phishing Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan completed at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** URLScan.io + manual watchlist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python3 - >> $GITHUB_STEP_SUMMARY <<'EOF'
          import json
          import os


          def load(path, default):
              if not os.path.exists(path):
                  return default
              try:
                  with open(path) as f:
                      return json.load(f)
              except (json.JSONDecodeError, OSError):
                  return default


          stats = load('feed/stats.json', {})
          feed = load('feed/phishing_feed.json', [])

          if stats:
              last = stats.get('last_run_stats', {})
              cum = stats.get('cumulative_stats', {})
              scanned = cum.get('total_domains_scanned',
                                cum.get('total_unique_domains_scanned', 0))

              print("**📊 This Run:**")
              print(f"- Domains processed: **{last.get('domains_processed', 0)}**")
              print(f"- Phishing detected: **{last.get('phishing_detected', 0)}** "
                    f"({last.get('new_unique_phishing', 0)} new) 🚨")
              print(f"- Runtime: **{last.get('elapsed_time', 0)}s**")
              print("")

              excluded = last.get('excluded_by_reason', {})
              if excluded:
                  print("**🧹 Filtered out this run:**")
                  for reason, count in sorted(excluded.items(), key=lambda kv: -kv[1]):
                      print(f"- `{reason}`: {count}")
                  print("")

              print("**📈 Cumulative:**")
              print(f"- Domains scanned (all runs): **{scanned}**")
              print(f"- Unique phishing domains found: "
                    f"**{cum.get('total_unique_phishing_found', 0)}**")
              print(f"- Total runs: **{cum.get('total_runs', 0)}**")
              print(f"- Detection rate: **{cum.get('phishing_detection_rate', 0)}%**")
              print("")

          if feed:
              print(f"**📋 Total threats in feed:** {len(feed)}")
              print("")
              print("**🔍 Most recent detections:**")
              recent = sorted(feed, key=lambda e: e.get('detected_at', ''))[-5:]
              for entry in reversed(recent):
                  brands = ', '.join(entry.get('details', {}).get('brand_keywords', [])) or 'n/a'
                  print(f"- `{entry.get('domain', 'N/A')}` "
                        f"(score: {entry.get('score', 0)}/100, brand: {brands})")
          EOF

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🎯 Target:** phishing aimed at Bulgarian citizens — banks and online banking, MVR and e-government, toll/vignette services, payment providers, couriers and marketplaces" >> $GITHUB_STEP_SUMMARY
