name: Daily LLM Analysis

on:
  schedule:
    # Run daily at 00:10 UTC (10 minutes after midnight)
    - cron: '10 0 * * *'

  # Allow manual trigger
  workflow_dispatch:

# Prevent multiple analysis runs
concurrency:
  group: llm-analysis
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM analysis on high-risk domains
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🤖 Starting LLM analysis at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          python detection/llm_analyzer.py \
            --feed-file feed/phishing_feed.json \
            --output-file feed/llm-analysis.json \
            --min-score 75 \
            --max-analyze 50
        continue-on-error: false

      - name: Check for analysis updates
        id: check_changes
        run: |
          if [[ -n $(git status -s feed/phishing_feed.json feed/llm-analysis.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ LLM analysis completed and added to feed"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No domains required analysis"
          fi

      - name: Commit analysis results
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'LLM Analysis Bot'
          git config --global user.email 'llm@bg-phishing-detector'

          # Pull latest changes
          git pull --rebase origin main || true

          git add -f feed/phishing_feed.json feed/llm-analysis.json
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          git commit -m "🤖 LLM analysis complete - $TIMESTAMP [skip ci]"

          # Push with retry logic
          for i in {1..3}; do
            if git push; then
              echo "✅ Successfully pushed LLM analysis"
              break
            else
              if [ $i -lt 3 ]; then
                echo "⚠️  Push failed, retrying in 5 seconds... (attempt $i/3)"
                sleep 5
                git pull --rebase origin main || true
              else
                echo "❌ Failed to push after 3 attempts"
                exit 1
              fi
            fi
          done

      - name: Analysis summary
        if: always()
        run: |
          echo "### 🤖 LLM Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis completed at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** Arcee Trinity Large (OpenRouter free tier)" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** Domains with score >= 75" >> $GITHUB_STEP_SUMMARY
          echo "**Max domains:** 50 per run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f feed/llm-analysis.json ]]; then
            python3 - >> $GITHUB_STEP_SUMMARY <<'EOF'
          import json

          with open('feed/llm-analysis.json') as f:
              data = json.load(f)

          domains = data.get('domains', [])
          new_count = data.get('newly_analyzed', 0)


          def verdict(entry):
              return entry.get('llm_analysis', {})


          high = [e for e in domains if verdict(e).get('threat_level') == 'HIGH']
          medium = [e for e in domains if verdict(e).get('threat_level') == 'MEDIUM']
          block = [e for e in domains if verdict(e).get('decision') == 'BLOCK']

          print("**📊 Results:**")
          print(f"- Analysed this run: **{new_count}**")
          print(f"- Total analyses on file: **{len(domains)}**")
          print(f"- High threat: **{len(high)}** 🚨")
          print(f"- Medium threat: **{len(medium)}** ⚠️")
          print(f"- Block recommended: **{len(block)}** 🛑")
          print("")
          print("**🚨 Highest-risk domains:**")
          if high:
              for e in high[:10]:
                  v = verdict(e)
                  print(
                      f"- `{e.get('domain', 'N/A')}` "
                      f"(score: {e.get('phishing_score', 0)}, "
                      f"confidence: {v.get('confidence', 0)}%, "
                      f"mimics: {v.get('mimicked_domain', 'NONE')}, "
                      f"decision: {v.get('decision', 'UNKNOWN')})"
                  )
          else:
              print("- No high-threat domains recorded")
          EOF
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**🎯 Purpose:** AI-powered validation of rule-based detections" >> $GITHUB_STEP_SUMMARY
